name: Sector Shadow Prediction

on:
  workflow_dispatch:
  schedule:
    # 15:30 Asia/Taipei, Monday-Friday. Runner is idempotent on holidays/weekends.
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: sector-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Run shadow prediction and mature scoring
        run: npm run shadow
      - name: Commit shadow ledger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shadow
          if git diff --cached --quiet; then
            echo "No new trading-day snapshot or mature score."
            exit 0
          fi
          git commit -m "data: update sector shadow ledger"
          git push
