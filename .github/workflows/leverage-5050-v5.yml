name: Leverage 50-50 v5 CBC Cash Yield

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leverage-5050-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' openpyxl
      - name: Compile and base self-test
        run: |
          python -m py_compile leverage5050Backtest.py leverage5050CashBacktest.py scripts/runLeverage5050Backtest.py scripts/runLeverage5050V2.py scripts/runLeverage5050V5Cash.py
          python scripts/selfTestLeverage5050.py
      - name: Run official CBC cash-yield robustness validation
        run: python scripts/runLeverage5050V5Cash.py
      - name: Commit compact v5 report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtests/leverage_5050_v5.json docs/LEVERAGE_5050_V5.md
          if git diff --cached --quiet; then
            echo "No v5 leverage report changes."
            exit 0
          fi
          git commit -m "backtest: update leverage 50-50 v5"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
