name: Test

on:
  push:
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate research dashboard JavaScript
        run: node --check public/research-dashboard.js
      - name: Validate dashboard JSON inputs
        run: |
          node -e "const fs=require('fs'); for (const p of ['data/shadow/challenger_latest.json','data/backtests/ml_challenger_v031.json','data/backtests/rotation_v0.4.json']) JSON.parse(fs.readFileSync(p,'utf8')); console.log('dashboard JSON inputs valid')"
