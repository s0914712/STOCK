name: Test

on:
  push:
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # The baseline parity test imports only baselineScore.py, which is
      # stdlib-only, so this needs no pip install and adds a few seconds.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Champion baseline parity (Python side)
        run: python3 test/baselineParity.test.py
      - name: Validate research dashboard JavaScript
        run: node --check public/research-dashboard.js
      - name: Validate dashboard JSON inputs
        run: |
          node -e "const fs=require('fs'); for (const p of ['data/shadow/challenger_latest.json','data/backtests/ml_challenger_v031.json','data/backtests/rotation_v0.4.json']) JSON.parse(fs.readFileSync(p,'utf8')); console.log('dashboard JSON inputs valid')"
