name: Momentum Rotation v0.5 Train

on:
  workflow_dispatch:
  push:
    branches:
      - feature/momentum-rotation-v05
    paths:
      - '.github/workflows/momentum-v05-train.yml'
  schedule:
    # Sunday 11:00 Asia/Taipei. Scheduled workflows run from the repository default branch after merge.
    - cron: '0 3 * * 0'

permissions:
  contents: write

concurrency:
  group: momentum-v05-train-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: pip install -r requirements-ml.txt
      - name: Train v0.5 continuation models
        run: python scripts/trainMomentumV05.py
      - name: Commit v0.5 model artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models/v05 data/backtests/momentum_v05_ml_validation.json
          if git diff --cached --quiet; then
            echo "No v0.5 model changes."
            exit 0
          fi
          git commit -m "model: retrain momentum challenger v0.5"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
