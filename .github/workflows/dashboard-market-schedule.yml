name: Daily Market Dashboard Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '45 8 * * 1-5' # 16:45 Asia/Taipei; after v0.5.1 freshness cutoff
  push:
    branches:
      - claude/taiwan-stock-dashboard-AsiJO
    paths:
      - '.github/workflows/dashboard-market-schedule.yml'
      - 'scripts/twseOpenApi.js'
      - 'scripts/runDashboardMarketSnapshot.js'
      - 'scripts/runFactorResearch.js'
      - 'scripts/runRecommendationV051.js'
      - 'factorResearch.js'
      - 'recommendationV051.js'
      - 'test/twseOpenApi.test.js'
      - 'test/marketFreshnessV051.test.js'
      - 'test/factorResearch.test.js'
      - 'test/recommendationV051.test.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: daily-market-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build latest market snapshot
        run: npm run snapshot:openapi
      - name: Build point-in-time factor research
        run: npm run research:factors
      - name: Build v0.5.1 recommendation research ranking
        run: npm run recommend:v051
      - name: Publish official snapshot, forward ledgers and v0.5.1 ranking
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/dashboard/market_latest.json \
            data/dashboard/openapi_forward.jsonl \
            data/dashboard/sector_representatives_latest.json \
            data/dashboard/factor_research_latest.json \
            data/dashboard/factor_forward.jsonl
          if [ -f data/dashboard/factor_outcomes.jsonl ]; then
            git add data/dashboard/factor_outcomes.jsonl
          fi
          if [ -f data/dashboard/recommendation_v0.5.1_latest.json ]; then
            git add data/dashboard/recommendation_v0.5.1_latest.json
          fi
          if git diff --cached --quiet; then
            echo "No market snapshot changes."
            exit 0
          fi
          git commit -m "data: update daily market dashboard"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
