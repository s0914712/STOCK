name: Momentum Rotation v0.5.1 Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momentum-v051-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: pip install -r requirements-ml.txt
      - name: v0.5.1 deterministic self-test
        run: python scripts/selfTestMomentumV051.py
      - name: Run 5Y calibration / trend ablation
        run: python scripts/runMomentumV051Backtest.py
      - name: Compact detailed trace
        run: python scripts/compactMomentumV051Report.py
      - name: Commit compact v0.5.1 report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtests/momentum_rotation_v0.5.1_summary.json docs/MOMENTUM_ROTATION_V051.md
          if git diff --cached --quiet; then
            echo "No v0.5.1 report changes."
            exit 0
          fi
          git commit -m "backtest: update momentum rotation v0.5.1"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
