name: Inspect CBC Deposit Rates

on:
  workflow_dispatch:
  push:
    branches:
      - feature/leverage-5050-challenger
    paths:
      - 'scripts/inspectCbcDepositRates.py'
      - '.github/workflows/inspect-cbc-deposit.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl
      - run: python scripts/inspectCbcDepositRates.py
