name: ML Challenger Train v0.3.1

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sector-radar-v031-v04
    paths:
      - '.github/workflows/ml-challenger-train.yml'
  schedule:
    # Sunday 10:00 Asia/Taipei. Uses only labels already mature at run time.
    - cron: '0 2 * * 0'

permissions:
  contents: write

concurrency:
  group: stock-data-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: pip install -r requirements-ml.txt
      - name: ML self-test
        run: python mlChallenger.py
      - name: Train calibrated baseline, LightGBM and XGBoost
        run: python scripts/trainMlChallenger.py
      - name: Commit model artifacts and validation report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models/sector_challenger_v031 data/backtests/ml_challenger_v031.json
          if git diff --cached --quiet; then
            echo "No model artifact changes."
            exit 0
          fi
          git commit -m "model: retrain sector challenger v0.3.1"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
