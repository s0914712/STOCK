name: Momentum Rotation v0.5 Shadow

on:
  workflow_dispatch:
  push:
    branches:
      - feature/momentum-rotation-v05
    paths:
      - 'data/models/v05/**'
      - '.github/workflows/momentum-v05-shadow.yml'
  schedule:
    # Weekdays 15:40 Asia/Taipei. Scheduled workflows run from default branch after merge.
    - cron: '40 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: momentum-v05-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: pip install -r requirements-ml.txt
      - name: Run v0.5 daily portfolio shadow
        run: python scripts/runMomentumV05Shadow.py
      - name: Commit v0.5 shadow ledgers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shadow/momentum_v05_predictions.jsonl data/shadow/momentum_v05_scores.jsonl data/shadow/momentum_v05_latest.json
          if git diff --cached --quiet; then
            echo "No v0.5 shadow changes."
            exit 0
          fi
          git commit -m "shadow: update momentum rotation v0.5"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
