name: Deploy Research Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - claude/taiwan-stock-dashboard-AsiJO
      - main
      - feature/momentum-rotation-v05
    paths:
      - 'public/research-dashboard.html'
      - 'public/research-dashboard.css'
      - 'public/research-dashboard.js'
      - 'data/shadow/**'
      - 'data/backtests/ml_challenger_v031.json'
      - 'data/backtests/rotation_v0.4.json'
      - 'data/backtests/momentum_rotation_v0.5.json'
      - 'data/backtests/momentum_v05_ml_validation.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static dashboard
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data/shadow _site/data/backtests
          cp public/research-dashboard.html _site/index.html
          cp public/research-dashboard.css _site/research-dashboard.css
          cp public/research-dashboard.js _site/research-dashboard.js
          cp data/shadow/challenger_latest.json _site/data/shadow/challenger_latest.json
          cp data/backtests/ml_challenger_v031.json _site/data/backtests/ml_challenger_v031.json
          cp data/backtests/rotation_v0.4.json _site/data/backtests/rotation_v0.4.json
          # Optional v0.5 files are copied as soon as their Shadow/backtest jobs exist.
          for f in \
            data/shadow/latest.json \
            data/shadow/momentum_v05_latest.json \
            data/backtests/momentum_rotation_v0.5.json \
            data/backtests/momentum_v05_ml_validation.json; do
            if [ -f "$f" ]; then
              mkdir -p "_site/$(dirname "$f")"
              cp "$f" "_site/$f"
            fi
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Keep a separate preview environment while stacked PRs are on feature branches.
    # After the stack lands on the repository default branch, the same workflow
    # continues to publish the canonical Pages site without branch-root deployment.
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
