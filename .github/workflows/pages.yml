name: Deploy Research Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '40 8 * * 1-5' # 16:40 Asia/Taipei, after the 16:20 official snapshot refresh
  push:
    branches:
      - claude/taiwan-stock-dashboard-AsiJO
    paths:
      - 'public/research-dashboard.html'
      - 'public/research-dashboard.css'
      - 'public/research-dashboard.js'
      - 'public/time-series-guide.html'
      - 'public/time-series-guide.css'
      - 'data/shadow/**'
      - 'data/backtests/ml_challenger_v031.json'
      - 'data/backtests/rotation_v0.4.json'
      - 'data/dashboard/factor_research_latest.json'
      - 'data/dashboard/sector_representatives_latest.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static dashboard
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data/shadow _site/data/backtests _site/data/dashboard
          cp public/research-dashboard.html _site/index.html
          cp public/research-dashboard.css _site/research-dashboard.css
          cp public/research-dashboard.js _site/research-dashboard.js
          cp public/time-series-guide.html _site/time-series-guide.html
          cp public/time-series-guide.css _site/time-series-guide.css
          cp data/shadow/challenger_latest.json _site/data/shadow/challenger_latest.json
          cp data/backtests/ml_challenger_v031.json _site/data/backtests/ml_challenger_v031.json
          cp data/backtests/rotation_v0.4.json _site/data/backtests/rotation_v0.4.json
          cp data/dashboard/factor_research_latest.json _site/data/dashboard/factor_research_latest.json
          cp data/dashboard/sector_representatives_latest.json _site/data/dashboard/sector_representatives_latest.json
          if [ -f data/shadow/latest.json ]; then
            cp data/shadow/latest.json _site/data/shadow/latest.json
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
