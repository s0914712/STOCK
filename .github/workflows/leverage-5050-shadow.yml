name: Leverage 50-50 Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: '55 7 * * 1-5' # 15:55 Asia/Taipei
  push:
    branches:
      - feature/leverage-5050-challenger
    paths:
      - 'scripts/runLeverage5050Shadow.py'
      - '.github/workflows/leverage-5050-shadow.yml'

permissions:
  contents: write

concurrency:
  group: leverage-5050-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' openpyxl
      - name: Compile
        run: python -m py_compile leverage5050Backtest.py leverage5050CashBacktest.py scripts/runLeverage5050Backtest.py scripts/runLeverage5050V5Cash.py scripts/runLeverage5050Shadow.py
      - name: Run leverage shadow state
        run: python scripts/runLeverage5050Shadow.py
      - name: Commit shadow ledger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shadow/leverage_5050_latest.json data/shadow/leverage_5050_predictions.jsonl
          if git diff --cached --quiet; then
            echo "No leverage shadow changes."
            exit 0
          fi
          git commit -m "shadow: update leverage 50-50 state"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
